name: Probe Open Food Facts 1k archive
on:
  push:
    branches: [feature/free-product-scale-phase1]
    paths:
      - .github/workflows/useme-probe-off-data.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python phase1-scale/scripts/probe-openfoodfacts.py
