name: Import 1000 public real e-commerce product references
on:
  push:
    branches: [feature/free-product-scale-phase1]
    paths: ["phase1-scale/scripts/import-real-ecommerce.py", ".github/workflows/useme-real-catalog-import.yml"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download and validate actual source product records
        run: python phase1-scale/scripts/import-real-ecommerce.py
      - name: Commit validated reference dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add phase1-scale/data/real-1000-products.json
          git diff --cached --quiet && exit 0
          git commit -m "Add 1000 actual source-linked product references"
          git push
