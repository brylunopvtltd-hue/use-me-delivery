name: USE ME Daraz 3-4 mobile grid QA
on:
  push:
    branches: [feature/free-product-scale-phase1]
    paths:
      - "phase1-scale/useme-daraz-mobile-grid-v10.css"
      - "phase1-scale/useme-daraz-mobile-grid-v10.js"
      - ".github/workflows/useme-daraz-grid-check.yml"
permissions:
  contents: read
jobs:
  verify-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check phase1-scale/useme-daraz-mobile-grid-v10.js
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install chromium
      - name: Test live cards with staged compact 3/4 grid injected
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const css=fs.readFileSync('phase1-scale/useme-daraz-mobile-grid-v10.css','utf8');
          const js=fs.readFileSync('phase1-scale/useme-daraz-mobile-grid-v10.js','utf8');
          const browser=await chromium.launch({headless:true});
          for(const width of [360,390,520]){
            const page=await browser.newPage({viewport:{width,height:844},isMobile:true,deviceScaleFactor:1});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto('https://use-me-superapp-web.bryluno-zunora.workers.dev/shop?gridqatest=1',{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForSelector('#liveProducts .v3-product-card',{timeout:30000});
            await page.addStyleTag({content:css});
            await page.addScriptTag({content:js});
            await page.waitForSelector('#usemeGridDensity',{timeout:3000});
            const first=await page.evaluate(()=>{
              const grid=document.querySelector('#liveProducts');
              const cols=getComputedStyle(grid).gridTemplateColumns.split(' ').length;
              const card=grid.querySelector('.v3-product-card');
              const pic=card.querySelector('.v3-product-media');
              const price=card.querySelector('.v3-product-price');
              const add=card.querySelector('.v3-add-cart');
              return {width:window.innerWidth,cols,cardWidth:Math.round(card.getBoundingClientRect().width),
                imgWidth:Math.round(pic.getBoundingClientRect().width),priceVisible:!!price?.getClientRects().length,
                addVisible:!!add?.getClientRects().length,overflow:grid.scrollWidth>grid.clientWidth+2,
                count:document.querySelector('#v7-product-count')?.textContent,buttons:[...document.querySelectorAll('#usemeGridDensity button')].map(b=>b.getAttribute('aria-pressed'))};
            });
            console.log('DARAZ_GRID_DEFAULT',JSON.stringify(first));
            const expected=width>=480?4:3;
            if(first.cols!==expected||first.overflow||!first.priceVisible||!first.addVisible||first.cardWidth<65)throw Error('Responsive layout broken at '+width);
            await page.locator('#usemeGridDensity button[data-cols="4"]').click();
            const chosen=await page.evaluate(()=>({cols:getComputedStyle(document.getElementById('liveProducts')).gridTemplateColumns.split(' ').length,pressed:document.querySelector('#usemeGridDensity button[data-cols="4"]').getAttribute('aria-pressed')}));
            console.log('DARAZ_GRID_TOGGLE',JSON.stringify({width,...chosen}));
            if(chosen.cols!==4||chosen.pressed!=='true')throw Error('Four-column switch broken at '+width);
            console.log('DARAZ_PAGE_ERRORS',JSON.stringify({width,errors}));
            if(errors.length)throw Error('Page JS errors at '+width);
            await page.close();
          }
          await browser.close();
          JS